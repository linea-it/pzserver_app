name: Test API workflow

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Test python API
    services:
      postgres:
        image: postgres:13.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-test-only
          POSTGRES_DB: pzserver_device_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
    - uses: actions/checkout@v4
    - name: Set up uWSGI dependencies
      uses: awalsh128/cache-apt-pkgs-action@v1.4.3
      with:
        packages: gcc python3-dev build-essential libpcre3 libpcre3-dev
        version: 1.0
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        # Semantic version range syntax or exact version of a Python version
        python-version: '3.11'
        # Optional - x64 or x86 architecture, defaults to x64
        architecture: 'x64'
    # You can test your matrix by printing the current Python version
    - name: Display Python version
      run: python -c "import sys; print(sys.version)"    
    - name: Install requirements
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip wheel
        pip install -r requirements.txt
    - name: Run tests and collect coverage
      working-directory: ./backend    
      run: pytest --cov=./ --cov-report=xml
    - name: Test Device Flow with PostgreSQL
      working-directory: ./backend
      env:
        PZSERVER_TEST_POSTGRES_HOST: 127.0.0.1
        PZSERVER_TEST_POSTGRES_PASSWORD: postgres-test-only
      run: pytest core/test/test_device_flow.py -q
    - name: Upload coverage reports to Codecov with GitHub Action
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
