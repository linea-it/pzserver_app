<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="same-origin">
<title>{% block title %}Authorize Python access{% endblock %} · Photo-z Server</title>
<link href="https://fonts.googleapis.com/css?family=Oxanium|Roboto:300,400,500,700&amp;display=swap" rel="stylesheet">
<script>
try { if (localStorage.getItem('darkMode') === '1') document.documentElement.dataset.theme = 'dark'; } catch (error) {}
</script>
<style>
:root {color-scheme:light;--bg:#f1f1f1;--surface:#fff;--text:rgba(0,0,0,.87);--muted:rgba(0,0,0,.6);--line:rgba(0,0,0,.23);--accent:#1976d2;--soft:#e3f2fd;--danger:#d32f2f}
[data-theme="dark"] {color-scheme:dark;--bg:#121212;--surface:#1e1e1e;--text:#fff;--muted:rgba(255,255,255,.7);--line:rgba(255,255,255,.3);--accent:#90caf9;--soft:#193346;--danger:#f44336}
* {box-sizing:border-box}
body {margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:400 16px/1.5 Roboto,Helvetica,Arial,sans-serif;letter-spacing:.15px}
a {color:var(--accent)}
header {background:#212121;color:#fff;box-shadow:0 2px 4px #0003}
.nav {min-height:64px;padding:12px 32px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.brand {font:400 23px/1.3 Oxanium,Roboto,sans-serif;color:#fff;text-decoration:none;white-space:nowrap}
.beta {font:400 18px Oxanium,Roboto,sans-serif;color:#03a9f4;margin-left:10px}
.nav-link {font-size:14px;font-weight:500;text-transform:uppercase;text-decoration:none;color:#fff}
.tag {margin-left:auto;color:#ddd;font-size:14px}
main {width:100%;max-width:800px;padding:32px 24px 40px;margin:0 auto;flex:1}
.breadcrumb {font-size:14px;color:var(--muted);margin:0 0 20px}
.breadcrumb a {text-decoration:none;color:var(--muted)}
.breadcrumb span {margin:0 10px}
.card {padding:32px;border-radius:4px;background:var(--surface);box-shadow:0 2px 1px -1px #0003,0 1px 1px #00000024,0 1px 3px #0000001f}
.eyebrow {color:var(--muted);font-size:13px;font-weight:500;margin:0 0 12px}
h1 {font:400 30px/1.25 Roboto,Helvetica,Arial,sans-serif;letter-spacing:0;margin:0 0 16px}
p {margin:0 0 20px}
.intro,.hint {color:var(--muted)}
.account {padding:12px 16px;margin-bottom:24px;border-left:3px solid var(--accent);background:var(--soft);border-radius:4px;font-size:14px;overflow-wrap:anywhere}
.account span {display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.hint {font-size:14px}
label {display:block;font-size:14px;font-weight:500;margin-bottom:8px}
input {font:400 22px/1.4 Roboto,Helvetica,Arial,sans-serif;letter-spacing:3px;width:100%;padding:15px 14px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--text)}
input:focus-visible {outline:2px solid var(--accent);outline-offset:-2px}
button:focus-visible,a:focus-visible {outline:3px solid #64b5f6;outline-offset:3px}
.actions {display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
button,.button {font:500 14px/1.75 Roboto,Helvetica,Arial,sans-serif;letter-spacing:.4px;text-transform:uppercase;cursor:pointer;padding:8px 22px;border-radius:4px;border:1px solid var(--accent);background:var(--accent);color:#fff;text-decoration:none;text-align:center;box-shadow:0 2px 4px #0003}
.secondary {background:transparent;color:var(--accent);box-shadow:none}
button:hover,.button:hover {filter:brightness(.94)}
[data-theme="dark"] button,[data-theme="dark"] .button {color:#121212}
[data-theme="dark"] .secondary {color:var(--accent)}
.errors {color:var(--danger);font-size:14px;margin:10px 0}
.errors ul {margin:0;padding-left:20px}
.permissions {padding:16px 16px 16px 36px;border:1px solid var(--line);border-radius:4px}
.permissions li+li {margin-top:6px}
.app {font-weight:500;overflow-wrap:anywhere}
.security-note {font-size:12px;color:var(--muted);margin:16px 0 0}
.status-icon {width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--accent);font-size:25px;margin-bottom:20px}
.site-footer {background:#212121;color:#ddd;padding:16px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:13px}
.site-footer a {color:#fff;text-decoration:none}
.partners {display:flex;align-items:center;gap:20px}
.partners img {object-fit:contain}
.powered {display:flex;align-items:center;gap:12px}
@media(max-width:600px) {.nav{padding:14px 20px;gap:12px}.brand{font-size:20px}.tag{width:100%;margin-left:0}.nav-link{margin-left:auto}main{padding:24px 16px}.card{padding:24px 20px}h1{font-size:26px}.actions>*{width:100%}.site-footer{padding:16px 20px}}
</style>
</head>
<body>
<header><nav class="nav" aria-label="Main navigation"><a class="brand" href="/">Photo-z Server <span class="beta">Beta</span></a><a class="nav-link" href="/">Home</a><span class="tag">Python client access</span></nav></header>
<main><div class="breadcrumb"><a href="/">Home</a><span aria-hidden="true">/</span>Python client access</div><div class="card">{% block content %}{% endblock %}</div><p class="security-note">Only approve requests you started in your own notebook or terminal. PzServer never needs your JupyterHub token for this sign-in.</p></main>
<footer class="site-footer"><div class="partners"><img src="/rubin.png" alt="Rubin Observatory" width="80" height="50"><span>Photo-z Server</span></div><a class="powered" href="https://www.linea.org.br/">Powered by <img src="/logo.png" alt="LIneA" width="52" height="52"></a></footer>
</body></html>
